aid: lightberry
name: Lightberry
description: Lightberry is a San Francisco robotics software company (Y Combinator Fall 2025) that
  builds conversational AI "personality" software for humanoid and quadruped robots. Its platform lets
  a robot listen, speak, see its surroundings, and act on natural-language instruction without the
  owner writing any code, emphasizing emotional intelligence, contextual awareness, and autonomy rather
  than a simple speech-to-text voice pipeline. Lightberry ships pre-installed on robots sold through its
  partnership with Unitree, and the company runs a manufacturer-compatibility program with robot makers
  including Fourier, Booster Robotics, and High Torque. Its published documentation today covers device
  setup (power-on, WiFi provisioning, starting a conversation) plus an MCP architecture note describing
  a Model Context Protocol server that routes tool calls to individual Lightberry devices, which each
  expose a REST endpoint. There is no public developer portal, API reference, SDK, or OpenAPI definition
  at this time.
